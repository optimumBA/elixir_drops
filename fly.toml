app = "elixirdrops-staging"
kill_signal = "SIGTERM"
primary_region = "fra"

[build]

[deploy]
release_command = "/app/bin/migrate"
strategy = "bluegreen"

[env]
PHX_HOST = "elixirdrops-staging.fly.dev"
PORT = "8080"
PRIMARY_REGION = "fra"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8080
min_machines_running = 0
processes = ["app"]

[http_service.concurrency]
hard_limit = 1000
soft_limit = 1000
type = "connections"

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/health"
timeout = "5s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 512
