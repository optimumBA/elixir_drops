app = 'elixirdrops'
primary_region = 'fra'
kill_signal = 'SIGTERM'

[build]

[deploy]
release_command = '/app/bin/migrate'
strategy = 'bluegreen'

[env]
PHX_HOST = 'elixirdrops.fly.dev'
PORT = '8080'
PRIMARY_REGION = 'fra'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[http_service.concurrency]
type = 'connections'
hard_limit = 1000
soft_limit = 1000

[[http_service.checks]]
grace_period = '15s'
interval = '10s'
method = 'GET'
path = '/health'
timeout = '2s'

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
